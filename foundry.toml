[profile.default]
src = "packages/contracts"
test = "tests/solidity"
out = ".local/foundry-out"
cache_path = ".local/foundry-cache"
libs = ["node_modules"]
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"]
optimizer = true
optimizer_runs = 200
evm_version = "shanghai"
fuzz.runs = 256
